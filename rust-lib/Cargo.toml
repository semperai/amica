[package]
name = "amica-rust-lib"
version = "0.1.0"
description = "Rust library for Amica"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.15.1", default-features = false, features = ["napi4", "tokio_rt", "serde_json"] }
napi-derive = "2.15.1"
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3.30"
lazy_static = "1.4.0"

[build-dependencies]
napi-build = "2.0.1"
